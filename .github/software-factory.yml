version: 1
factory:
  enabled: true # also gates deploy: the deploy plan reports "disabled" otherwise
  scope: "Implement explicitly SF-managed tasks for letterflow (Next.js app for
    B2B postal acquisition). Independently review and conditionally merge
    Factory PRs and PRs explicitly enrolled with sf:automerge. Respect CLAUDE.md
    (public repo: no real lead data, no secrets)."
manager:
  workflow: factory-manager.yml
  maxActions: 10
  timeoutMinutes: 15
  maxContextTasks: 20
  maxContextChars: 20000
  trustedActors:
    - github-actions[bot]
    - munichdeveloper-sf-manager-local[bot]
autonomy:
  profile: autonomous
  overrides:
    transition: allow
    close_issue: allow
    create_followup: allow
    prioritize: allow
    approve_task: allow
    start_worker: allow
    retry_worker: allow
    cancel_worker: allow
    expand_scope: deny
    merge_pr: allow # Mandatory independent AI review and the required checks still apply.
execution:
  dryRun: false
  maxParallelWorkers: 1
  maxRetries: 2
  maxNewIssues: 3
  workerTimeoutMinutes: 30
  dispatchGraceMinutes: 10
  engine: temporal
  # A failed validation or a merge review that asks for changes starts a further attempt within maxRetries (software-factory#143).
  rework: true
llm:
  # Johannes 2026-11-20 (SF #203): Jev decides start order and start readiness (ready / unclear / too-large) with the
  # router settings below; every router skip plans like static.
  provider: jev
  model: gpt-4.1-mini
  reasoningEffort: null
  maxOutputTokens: 4000
  timeoutSeconds: 60
  maxCalls: 1
workers:
  test:
    enabled: false
  coding:
    enabled: true
    agents:
      - agent: claude
        model: claude-sonnet-5-5
        reasoningEffort: medium
      - agent: codex
        model: gpt-6.1-sol
        reasoningEffort: high
    retryAgents:
      - agent: claude
        model: claude-opus-5-5
        reasoningEffort: high
      - agent: codex
        model: gpt-6.1-sol
        reasoningEffort: high
    validationWorkflow: null
  review: false
reporting:
  persistDecisions: true

# Optional Slack bot connection is supplied through the SLACK_BOT_TOKEN Actions secret.
notifications:
  slack:
    enabled: true
    channel: C0CGJKK3EKS # ki-notification
    maxPerRun: 20
    since: '2026-11-20T14:30:00Z' # Do not backfill earlier actions.
    events:
      grant_required:
        # A task waits for nothing but a person's harness:ready (software-factory#127).
        enabled: true
        channel: null
      issue_created:
        enabled: true
        channel: null
      pr_merged:
        enabled: true
        channel: null
        actors: [] # Always Bot accounts only; optional narrower login allow-list.

# Optional independent AI merge reviewer; green CI alone never authorizes merging.
merge:
  enabled: true
  includeFactoryPRs: true
  adoptLabel: sf:automerge
  method: squash
  updateBranch: true
  # No branch ruleset on this repository: the Factory itself requires the checks on the exact, up-to-date head.
  protection: factory
  requiredChecks: [ test, docker ]
  validationWorkflow: test.yml
  maxReviewsPerRun: 1
  maxActionsPerRun: 1
  review:
    provider: openai # independent OpenAI review, separate from the Jev planner
    model: gpt-6.1-sol
    reasoningEffort: high
    timeoutSeconds: 120
    maxOutputTokens: 12000
    maxFiles: 60
    maxContextBytes: 250000
  postMergeWorkflows: []
  # Risk-based auto-merge like Controla and geschaeftsideen-web: up to medium risk on its own, above that a person approves.
  risk:
    enabled: true
    mode: enforce
    autoMergeUpTo: medium
    assessor:
      provider: openai

# Optional deployment of the default branch (docker-ssh: Docker Compose on a host via SSH).
# Secrets: DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS and, unless set below, DEPLOY_HOST/DEPLOY_USER.
# Requires the .github/workflows/factory-deploy.yml wrapper (install with --deploy).
deploy:
  enabled: true
  provider: docker-ssh
  trigger: checks # checks: after the listed CI workflows succeeded; push: right after the push
  workflows: [ "Test" ]
  environment: production
  host: null
  port: null
  user: null
  path: /docker/letterflow # analog /docker/business-os
  composeFile: compose.yaml
  project: letterflow # Docker Compose project. Keep stable: named volumes belong to it.
  envFile: .env # Relative to path (or absolute) on the host, linked into each release; null to disable.
  healthcheck:
    url: null # no host port; the container healthcheck in compose.yaml gates docker compose up --wait
    timeoutSeconds: 180
  rollback: true
  keepReleases: 5
  timeoutMinutes: 30
  githubDeployment: false # The wrapper's GitHub environment already records each deployment.

# Model router (Johannes, 2026-11-19, SF 0.16.0): TypeSafe Jev picks model and effort per call from these candidates.
# Without the broker's OpenRouter key, or on low confidence, the configured models run and Slack reports it.
router:
  enabled: true
  model: typesafe/jev-1.14
  # Johannes 2026-11-19: Jev chooses freely from the full model x effort matrix. With 11 options an even split is 9 %,
  # so 0.25 already means a clear lean; below it the configured workers.coding.agents run.
  minConfidence: 0.25
  timeoutSeconds: 10
  coding:
    candidates:
      - id: haiku-low
        agent: claude
        model: claude-haiku-5-5
        reasoningEffort: low
        description: "Trivial edits: typos, texts, config values, a one-line fix with an
          obvious place."
      - id: haiku-medium
        agent: claude
        model: claude-haiku-5-5
        reasoningEffort: medium
        description: "Small, fully specified change in one or two files that follows an
          existing pattern."
      - id: haiku-high
        agent: claude
        model: claude-haiku-5-5
        reasoningEffort: high
        description: "Small change in one area that needs some care, e.g. a simple test
          or a small UI tweak."
      - id: sonnet-low
        agent: claude
        model: claude-sonnet-5-5
        reasoningEffort: low
        description: "Routine contained change with clear acceptance criteria and little
          reasoning needed."
      - id: sonnet-medium
        agent: claude
        model: claude-sonnet-5-5
        reasoningEffort: medium
        description: "Clearly specified, contained changes in one area; bug fixes, small
          features, texts, tests."
      - id: sonnet-high
        agent: claude
        model: claude-sonnet-5-5
        reasoningEffort: high
        description: "Medium feature touching a few files, or a bug whose cause still
          has to be found."
      - id: opus-low
        agent: claude
        model: claude-opus-5-5
        reasoningEffort: low
        description: "Broad but well understood change where judgement matters more than
          deep reasoning."
      - id: opus-medium
        agent: claude
        model: claude-opus-5-5
        reasoningEffort: medium
        description: "Changes across several modules or a non-trivial feature with some
          design decisions."
      - id: opus-high
        agent: claude
        model: claude-opus-5-5
        reasoningEffort: high
        description: "New architecture, migrations, security, concurrency or hard
          debugging across modules."
      - id: codex-medium
        agent: codex
        model: gpt-6.1-sol
        reasoningEffort: medium
        description: "Mechanical change across many files with a clear rule, e.g.
          renames or API updates."
      - id: codex-high
        agent: codex
        model: gpt-6.1-sol
        reasoningEffort: high
        description: "Mostly mechanical but wide changes, refactorings and renames
          across many files."
  review:
    candidates:
      - id: haiku-low
        provider: claude
        model: claude-haiku-5-5
        reasoningEffort: low
        description: "Tiny pull requests: texts, docs, config values, one-line fixes."
      - id: haiku-medium
        provider: claude
        model: claude-haiku-5-5
        reasoningEffort: medium
        description: "Small pull requests with one clear purpose in one or two files."
      - id: haiku-high
        provider: claude
        model: claude-haiku-5-5
        reasoningEffort: high
        description: "Small pull requests where a mistake would still be easy to spot."
      - id: sonnet-low
        provider: claude
        model: claude-sonnet-5-5
        reasoningEffort: low
        description: "Routine pull requests of a few files with low behavioural impact."
      - id: sonnet-medium
        provider: claude
        model: claude-sonnet-5-5
        reasoningEffort: medium
        description: "Small to medium pull requests with few files and a clear purpose."
      - id: sonnet-high
        provider: claude
        model: claude-sonnet-5-5
        reasoningEffort: high
        description: "Medium pull requests that change behaviour in several files."
      - id: opus-low
        provider: claude
        model: claude-opus-5-5
        reasoningEffort: low
        description: "Large but mechanical pull requests, e.g. renames across many files."
      - id: opus-medium
        provider: claude
        model: claude-opus-5-5
        reasoningEffort: medium
        description: "Large pull requests or ones touching shared modules."
      - id: opus-high
        provider: claude
        model: claude-opus-5-5
        reasoningEffort: high
        description: "Security, authentication, payments, data migrations, deployment or
          concurrency changes."
  risk:
    candidates:
      - id: haiku-low
        provider: claude
        model: claude-haiku-5-5
        reasoningEffort: low
        description: "Tiny pull requests: texts, docs, config values, one-line fixes."
      - id: haiku-medium
        provider: claude
        model: claude-haiku-5-5
        reasoningEffort: medium
        description: "Small pull requests with one clear purpose in one or two files."
      - id: haiku-high
        provider: claude
        model: claude-haiku-5-5
        reasoningEffort: high
        description: "Small pull requests where a mistake would still be easy to spot."
      - id: sonnet-low
        provider: claude
        model: claude-sonnet-5-5
        reasoningEffort: low
        description: "Routine pull requests of a few files with low behavioural impact."
      - id: sonnet-medium
        provider: claude
        model: claude-sonnet-5-5
        reasoningEffort: medium
        description: "Small to medium pull requests with few files and a clear purpose."
      - id: sonnet-high
        provider: claude
        model: claude-sonnet-5-5
        reasoningEffort: high
        description: "Medium pull requests that change behaviour in several files."
      - id: opus-low
        provider: claude
        model: claude-opus-5-5
        reasoningEffort: low
        description: "Large but mechanical pull requests, e.g. renames across many files."
      - id: opus-medium
        provider: claude
        model: claude-opus-5-5
        reasoningEffort: medium
        description: "Large pull requests or ones touching shared modules."
      - id: opus-high
        provider: claude
        model: claude-opus-5-5
        reasoningEffort: high
        description: "Security, authentication, payments, data migrations, deployment or
          concurrency changes."
